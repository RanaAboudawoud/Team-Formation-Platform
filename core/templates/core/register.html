{% extends "core/base.html" %}

{% block navigation %}
{% endblock %}

{% block content %}

<div class = "auth-container">

    <h1>Create account</h1>

    <form method = "post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type = "submit">Create account</button>
    </form>

    <p>Already have an account? <a href = {% url 'login' %}>Log in here</a> </p>

</div>

{% endblock %}
