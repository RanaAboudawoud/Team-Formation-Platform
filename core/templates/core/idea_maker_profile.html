{% extends "core/base.html" %}

{% block content %}

<div class = "idea-maker-container">

    <a class = "create-project-link" href = "{% url 'create_project' %}">Create Project</a>

    <div class = "idea-maker-profile-card">

        <h1>Idea Maker</h1>
        <p class = "idea-maker-username">{{ idea_maker.profile.user.username }}</p>

        <form method = "post">
            {% csrf_token %}
            {{ idea_maker_form.as_p }}
            <button type = "submit">Save</button>
        </form>

    </div>
    
    <h2>My Projects</h2>

    {% for project in projects %}

        <div class = "idea-maker-project-card">

            <h3>{{ project.name }}</h3>
            <p>{{ project.description }}</p>

            <a class = "delete-project-link" href = "{% url 'delete_project' project.id %}">Delete Project</a>

        </div>

    {% endfor %}

</div>

{% endblock %}
