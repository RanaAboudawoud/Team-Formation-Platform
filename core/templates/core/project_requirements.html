{% extends "core/base.html" %}

{% block content %}

<h1>Project Requirements</h1>

<h2>{{ project.name }}</h2>

<form method = "POST">
    {% csrf_token %}
    {{ role_form.as_p }}

    {{ skill_formset.management_form }}

    {% for skill_form in skill_formset %}
        {{ skill_form.as_p }}
    {% endfor %}

    <button type = "submit">Save requirements</button>
</form>

<a href = "{% url 'idea_maker_profile' %}">Done</a>

{% endblock %}
