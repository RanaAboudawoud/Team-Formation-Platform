{% extends "core/base.html" %}

{% block navigation %}
{% endblock %}

{% block content %}

<div class = "auth-container">
    
    <h1>Login</h1>

    <form method = "post">
        {% csrf_token %}
        {{login_form.as_p}}
        <button type = "submit">Log in</button>
    </form>

    <p>Don't have an account? <a href = "{% url 'register' %}">Register here</a> </p>
    

</div>

{% endblock %}
